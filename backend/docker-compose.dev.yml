services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api_anomaly}
      POSTGRES_USER: ${POSTGRES_USER:-api_anomaly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-api_anomaly_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-api_anomaly} -d ${POSTGRES_DB:-api_anomaly}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

